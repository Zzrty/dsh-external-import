name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Build
        run: npm run build
      - name: The committed build output must match the sources
        shell: bash
        run: |
          if [ -n "$(git status --porcelain lib client)" ]; then
            echo "::error::lib/ or client/ differs from a fresh build — run 'npm run build' and commit the result"
            git --no-pager diff --stat lib client
            exit 1
          fi
      - name: Unit tests
        run: npm test
